name: Daily fund analysis

on:
  schedule:
    # GitHub Actions 使用 UTC。避开整点和常见的每10分钟高峰，降低定时任务延迟或被丢弃的概率。
    # 北京时间12:07-13:52每15分钟检查，14:07-14:37继续检查，并在14:40增加一次最终兜底。
    # 14:40后不再触发交易窗口提醒，为支付宝常规基金15:00截止预留操作时间；实际只按页面设置推送一次。
    - cron: '7,22,37,52 4-5 * * 1-5'
    - cron: '7,22,37 6 * * 1-5'
    - cron: '40 6 * * 1-5'
    # 北京时间18:17-23:47每天每半小时检查。拆成单独时刻，以便 GitHub 延迟到次日时仍能识别并补发正确日期。
    - cron: '17 10 * * *'
    - cron: '47 10 * * *'
    - cron: '17 11 * * *'
    - cron: '47 11 * * *'
    - cron: '17 12 * * *'
    - cron: '47 12 * * *'
    - cron: '17 13 * * *'
    - cron: '47 13 * * *'
    - cron: '17 14 * * *'
    - cron: '47 14 * * *'
    - cron: '17 15 * * *'
    - cron: '47 15 * * *'
  workflow_dispatch:
    inputs:
      report_mode:
        description: 选择要测试的报告
        required: true
        default: evening
        type: choice
        options:
          - preclose
          - evening
      formal_run:
        description: 正式补发（外部定时器专用；人工测试请保持关闭）
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-fund-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || ((contains(github.event.schedule, ' 10 ') || contains(github.event.schedule, ' 11 ') || contains(github.event.schedule, ' 12 ') || contains(github.event.schedule, ' 13 ') || contains(github.event.schedule, ' 14 ') || contains(github.event.schedule, ' 15 ')) && 'evening' || 'preclose') }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
      # 手动运行及“Re-run all jobs”都只用于测试/补发，不占用当天正式提醒名额。
      FORCE_SEND: ${{ ((github.event_name == 'workflow_dispatch' && inputs.formal_run != true) || github.run_attempt > 1) && 'true' || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FUND_WATCH_USER_ID: ${{ secrets.FUND_WATCH_USER_ID }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Analyze holdings and send the configured reminder
        run: node scripts/daily-analysis.mjs
