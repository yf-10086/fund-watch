name: Daily fund analysis

on:
  schedule:
    # GitHub Actions 使用 UTC。避开整点和常见的每10分钟高峰，降低定时任务延迟或被丢弃的概率。
    # 北京时间12:07-13:52每15分钟检查，14:07-14:37继续检查，并在14:40增加一次最终兜底。
    # 14:40后不再触发交易窗口提醒，为支付宝常规基金15:00截止预留操作时间；实际只按页面设置推送一次。
    - cron: '7,22,37,52 4-5 * * 1-5'
    - cron: '7,22,37 6 * * 1-5'
    - cron: '40 6 * * 1-5'
    # 北京时间18:17-23:47每天每半小时检查；周末也会筛选公告和新闻，按设置的晚报小时只推送一次。
    - cron: '17,47 10-15 * * *'
  workflow_dispatch:
    inputs:
      report_mode:
        description: 选择要测试的报告
        required: true
        default: evening
        type: choice
        options:
          - preclose
          - evening

permissions:
  contents: read

concurrency:
  group: daily-fund-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || (github.event.schedule == '17,47 10-15 * * *' && 'evening' || 'preclose') }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FUND_WATCH_USER_ID: ${{ secrets.FUND_WATCH_USER_ID }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Analyze holdings and send the configured reminder
        run: node scripts/daily-analysis.mjs
