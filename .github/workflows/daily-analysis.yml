name: Daily fund analysis

on:
  schedule:
    # GitHub Actions 使用 UTC。交易窗口每10分钟检查一次，实际只按页面设置推送一次。
    - cron: '*/10 4-6 * * 1-5'
    - cron: '55 6 * * 1-5'
    # 北京时间18:10-23:10每天检查；周末也会筛选公告和新闻，按设置的晚报小时只推送一次。
    - cron: '10 10-15 * * *'
  workflow_dispatch:
    inputs:
      report_mode:
        description: 选择要测试的报告
        required: true
        default: evening
        type: choice
        options:
          - preclose
          - evening

permissions:
  contents: read

concurrency:
  group: daily-fund-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_mode || (github.event.schedule == '10 10-15 * * *' && 'evening' || 'preclose') }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FUND_WATCH_USER_ID: ${{ secrets.FUND_WATCH_USER_ID }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Analyze holdings and send the configured reminder
        run: node scripts/daily-analysis.mjs
